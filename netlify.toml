# Netlify configuration for FloatChat AI Next.js frontend

[build]
  base = "nexus-saa-s-ai-platform"
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  NEXT_PUBLIC_API_MODE = "netlify"

[[plugins]]
  package = "@netlify/plugin-nextjs"
